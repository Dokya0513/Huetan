name: バグ報告 / Bug Report
description: 不具合を見つけた場合はこちら / Report something that isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きましたか？ / What happened?
      description: 見つけた不具合について教えてください / Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce
      description: どうすれば再現できますか？ / How can we reproduce this?
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作 / Expected behavior
  - type: dropdown
    id: platform
    attributes:
      label: プラットフォーム / Platform
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン / App version
      description: 設定画面などに表示されているバージョン番号 / The version number shown in Settings
      placeholder: "例 / e.g. v1.6.0"
  - type: textarea
    id: extra
    attributes:
      label: 補足（スクリーンショットなど） / Additional context (screenshots, etc.)
